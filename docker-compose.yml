version: '3.8'

services:
  fisna:
    build: .
    image: fisna:latest
    container_name: fisna
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # Optional: persist chat history (mount a volume, or use Upstash)
    # volumes:
    #   - fisna-data:/data

# volumes:
#   fisna-data:
